<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地震震度判斷互動題</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1f2933;
      --muted: #627181;
      --line: #d7dee8;
      --paper: #f7f9fc;
      --panel: #ffffff;
      --primary: #1d6f8f;
      --primary-dark: #15536b;
      --accent: #d9482f;
      --good: #2d8a54;
      --wrong: #b93a32;
      --shadow: 0 16px 38px rgba(31, 41, 51, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 8% 12%, rgba(29, 111, 143, 0.15), transparent 28%),
        linear-gradient(135deg, #eef4f7 0%, #f8fbfb 48%, #edf0f5 100%);
    }

    main {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 36px 0;
    }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(320px, 0.95fr);
      gap: 24px;
      align-items: start;
    }

    .hero {
      min-height: 210px;
      display: grid;
      align-content: end;
      padding: 28px;
      border-radius: 8px;
      color: white;
      background:
        linear-gradient(rgba(17, 45, 56, 0.72), rgba(17, 45, 56, 0.45)),
        url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1400&q=80") center/cover;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 4rem);
      line-height: 1;
      letter-spacing: 0;
    }

    .hero p {
      width: min(680px, 100%);
      margin: 0;
      font-size: 1.06rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.92);
    }

    .panel {
      margin-top: 20px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 10px 24px rgba(31, 41, 51, 0.08);
    }

    .panel:first-child {
      margin-top: 0;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--primary-dark);
      font-size: 0.84rem;
      font-weight: 700;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 1.35rem;
      line-height: 1.35;
      letter-spacing: 0;
    }

    .question-text {
      margin: 0 0 18px;
      color: #344453;
      font-size: 1.03rem;
      line-height: 1.8;
    }

    .scenario {
      display: grid;
      gap: 10px;
      margin: 16px 0 20px;
      padding: 16px;
      border-left: 5px solid var(--accent);
      border-radius: 6px;
      background: #fff6f2;
    }

    .scenario strong {
      color: #8f2e1f;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
    }

    input[type="text"] {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid #bac6d3;
      border-radius: 6px;
      color: var(--ink);
      font: inherit;
      background: white;
    }

    input[type="text"]:focus,
    .choice:focus-within {
      outline: 3px solid rgba(29, 111, 143, 0.2);
      border-color: var(--primary);
    }

    .choices {
      display: grid;
      gap: 10px;
      margin: 18px 0;
    }

    .choice {
      display: grid;
      grid-template-columns: 22px 1fr;
      gap: 12px;
      align-items: start;
      min-height: 54px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfe;
      cursor: pointer;
      transition: border-color 160ms ease, transform 160ms ease, background 160ms ease;
    }

    .choice:hover {
      transform: translateY(-1px);
      border-color: #9eb2c5;
      background: white;
    }

    .choice input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--primary);
    }

    .choice-title {
      display: block;
      font-weight: 800;
      line-height: 1.35;
    }

    .choice-note {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-top: 18px;
    }

    button {
      min-height: 44px;
      border: 0;
      border-radius: 6px;
      padding: 0 16px;
      color: white;
      background: var(--primary);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    button:hover {
      background: var(--primary-dark);
    }

    button.secondary {
      color: var(--primary-dark);
      border: 1px solid #aac0cd;
      background: white;
    }

    button.secondary:hover {
      background: #eef6f8;
    }

    .message {
      min-height: 24px;
      margin: 12px 0 0;
      color: var(--wrong);
      font-weight: 700;
    }

    .result {
      display: none;
    }

    .result.show {
      display: block;
    }

    .result-banner {
      padding: 14px 16px;
      border-radius: 8px;
      color: white;
      background: var(--good);
      font-weight: 800;
      line-height: 1.5;
    }

    .result-banner.wrong {
      background: var(--wrong);
    }

    .explanation {
      margin: 16px 0 0;
      color: #334353;
      line-height: 1.8;
    }

    .distribution {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .bar-row {
      display: grid;
      grid-template-columns: 78px 1fr 58px;
      gap: 10px;
      align-items: center;
      min-height: 34px;
    }

    .bar-label {
      font-weight: 800;
    }

    .bar-track {
      height: 18px;
      overflow: hidden;
      border-radius: 999px;
      background: #e7edf2;
    }

    .bar-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: var(--primary);
      transition: width 420ms ease;
    }

    .bar-fill.correct {
      background: var(--good);
    }

    .bar-value {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .subtle {
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .mini-table {
      display: grid;
      gap: 8px;
      margin-top: 14px;
    }

    .fact {
      display: grid;
      grid-template-columns: 72px 1fr;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #edf1f5;
    }

    .fact b {
      color: var(--primary-dark);
    }

    @media (max-width: 820px) {
      main {
        width: min(100% - 20px, 680px);
        padding: 10px 0 24px;
      }

      .app-shell {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .hero {
        min-height: 240px;
        padding: 22px;
      }

      .panel {
        padding: 18px;
      }

      .bar-row {
        grid-template-columns: 64px 1fr 48px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="hero" aria-label="地震震度判斷">
      <h1>地震震度判斷</h1>
      <p>請依照題目中的觀測線索，判斷最符合的震度。送出後會立即看到解析，以及各組答案分布。</p>
    </section>

    <div class="app-shell">
      <section class="panel" aria-labelledby="questionTitle">
        <p class="eyebrow">互動題 01</p>
        <h2 id="questionTitle">下列情境最接近哪一級震度？</h2>
        <p class="question-text">
          某地震發生後，教室內大多數人明顯感到搖晃，懸掛物大幅擺動，桌上的輕物品有些移位或掉落；但多數家具仍未傾倒，建築物也沒有明顯受損。
        </p>

        <div class="scenario" aria-label="判斷線索">
          <strong>判斷線索</strong>
          <span>人幾乎都能感覺到，室內物品反應明顯，但尚未出現嚴重破壞。</span>
        </div>

        <form id="quizForm">
          <label for="groupName">組別</label>
          <input id="groupName" name="groupName" type="text" maxlength="24" placeholder="例如：第 3 組" autocomplete="off">

          <div class="choices" role="radiogroup" aria-label="震度選項">
            <label class="choice">
              <input type="radio" name="answer" value="2">
              <span>
                <span class="choice-title">震度 2 級</span>
                <span class="choice-note">多數人在室內可感覺到，懸掛物輕微搖晃。</span>
              </span>
            </label>

            <label class="choice">
              <input type="radio" name="answer" value="3">
              <span>
                <span class="choice-title">震度 3 級</span>
                <span class="choice-note">幾乎所有人在室內都能感覺到，門窗、桌椅可能搖動。</span>
              </span>
            </label>

            <label class="choice">
              <input type="radio" name="answer" value="4">
              <span>
                <span class="choice-title">震度 4 級</span>
                <span class="choice-note">搖晃明顯，懸掛物大幅擺動，部分未固定物品可能掉落。</span>
              </span>
            </label>

            <label class="choice">
              <input type="radio" name="answer" value="5弱">
              <span>
                <span class="choice-title">震度 5 弱</span>
                <span class="choice-note">行走困難，未固定家具可能移動或翻倒，損害風險升高。</span>
              </span>
            </label>
          </div>

          <div class="actions">
            <button type="submit">送出答案</button>
            <button type="button" class="secondary" id="resetMine">重新載入統計</button>
          </div>
          <p class="message" id="message" aria-live="polite"></p>
        </form>
      </section>

      <aside>
        <section class="panel result" id="resultPanel" aria-live="polite">
          <p class="eyebrow">作答結果</p>
          <div class="result-banner" id="resultBanner"></div>
          <p class="explanation" id="explanation"></p>
        </section>

        <section class="panel" aria-labelledby="distributionTitle">
          <p class="eyebrow">即時統計</p>
          <h2 id="distributionTitle">答案分布</h2>
          <p class="subtle" id="totalText">目前尚未有作答紀錄。</p>
          <div class="distribution" id="distribution"></div>
        </section>

        <section class="panel" aria-labelledby="tipTitle">
          <p class="eyebrow">判斷小提醒</p>
          <h2 id="tipTitle">看「影響程度」比只看害怕程度更準</h2>
          <div class="mini-table">
            <div class="fact">
              <b>低震度</b>
              <span>多半是感覺得到、物品輕微搖晃。</span>
            </div>
            <div class="fact">
              <b>中震度</b>
              <span>室內反應明顯，物品可能移位或掉落。</span>
            </div>
            <div class="fact">
              <b>高震度</b>
              <span>站立或行走困難，家具翻倒與建物損害機率上升。</span>
            </div>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <script>
    const apiUrl = "https://script.google.com/macros/s/AKfycbyY3r6MV3lcnbmDxWfolhVE_wQ4gnU0g3bbpowhB0uixA5C-YaXIMivSAkdMYSotrS3bg/exec";
    const correctAnswer = "4";
    const options = ["2", "3", "4", "5弱"];

    const form = document.querySelector("#quizForm");
    const groupName = document.querySelector("#groupName");
    const message = document.querySelector("#message");
    const resultPanel = document.querySelector("#resultPanel");
    const resultBanner = document.querySelector("#resultBanner");
    const explanation = document.querySelector("#explanation");
    const distribution = document.querySelector("#distribution");
    const totalText = document.querySelector("#totalText");
    const resetMine = document.querySelector("#resetMine");
    const submitButton = form.querySelector("button[type='submit']");

    function emptyCounts() {
      return options.reduce((counts, option) => {
        counts[option] = 0;
        return counts;
      }, {});
    }

    function renderDistribution(counts = emptyCounts(), total = 0) {
      const safeCounts = { ...emptyCounts(), ...counts };

      totalText.textContent = total
        ? `目前共有 ${total} 組完成作答。`
        : "目前尚未有作答紀錄。";

      distribution.innerHTML = "";

      options.forEach((option) => {
        const count = safeCounts[option] || 0;
        const percent = total ? Math.round((count / total) * 100) : 0;
        const row = document.createElement("div");
        row.className = "bar-row";
        row.innerHTML = `
          <span class="bar-label">${option} 級</span>
          <span class="bar-track">
            <span class="bar-fill ${option === correctAnswer ? "correct" : ""}" style="width: ${percent}%"></span>
          </span>
          <span class="bar-value">${percent}%</span>
        `;
        distribution.appendChild(row);
      });
    }

    async function loadDistribution() {
      try {
        const response = await fetch(apiUrl, { method: "GET" });
        const data = await response.json();

        if (!data.ok) {
          throw new Error(data.message || "無法讀取統計。");
        }

        renderDistribution(data.counts, data.total);
      } catch (error) {
        message.textContent = "目前無法讀取 Google Sheets 統計，請稍後再試。";
        renderDistribution();
      }
    }

    async function submitAnswer(group, answer) {
      const url = new URL(apiUrl);
      url.searchParams.set("groupName", group);
      url.searchParams.set("answer", answer);

      const response = await fetch(url.toString(), { method: "GET" });

      const data = await response.json();

      if (!data.ok || data.groupName !== group || data.answer !== answer) {
        throw new Error(data.message || "送出失敗。");
      }

      return data;
    }

    function showResult(answer) {
      const isCorrect = answer === correctAnswer;
      resultPanel.classList.add("show");
      resultBanner.classList.toggle("wrong", !isCorrect);
      resultBanner.textContent = isCorrect
        ? "答對了：最符合的是震度 4 級。"
        : `這題的參考答案是震度 4 級，你選的是震度 ${answer} 級。`;
      explanation.textContent = "題目中的關鍵是「大多數人明顯感到搖晃」、「懸掛物大幅擺動」以及「部分輕物品移位或掉落」。這些現象已經比輕微搖晃更強，但還沒有到行走困難、家具大量翻倒或建築物明顯受損，因此最接近震度 4 級。";
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";

      const group = groupName.value.trim();
      const selected = new FormData(form).get("answer");

      if (!group) {
        message.textContent = "請先輸入組別。";
        groupName.focus();
        return;
      }

      if (!selected) {
        message.textContent = "請先選擇一個答案。";
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "送出中...";

      try {
        const data = await submitAnswer(group, selected);
        showResult(selected);
        renderDistribution(data.counts, data.total);
        message.textContent = "已送出並寫入 Google Sheets。";
      } catch (error) {
        message.textContent = "送出失敗，請確認 Web App 權限設為「任何人」後再試。";
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = "送出答案";
      }
    });

    resetMine.addEventListener("click", () => {
      message.textContent = "";
      loadDistribution();
    });

    renderDistribution();
    loadDistribution();
  </script>
</body>
</html>
